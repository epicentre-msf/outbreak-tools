# OutbreakTools -- Test Registry
# =============================================================================
# LAST FULL RUN (the whole registry, nothing commented out)
#   when:        2026-08-25 14:04 (run assembled 13:02, about 62 minutes)
#   where:       Windows 11, Excel hidden (windows/run-tests.vbs), --build
#   result:      total=4664 failures=0
#   modulesRun:  105   testsFound: 1747   vbe: ok(222)
#   before it:   total=4521 failures=0 modulesRun=90 testsFound=1684 (08:49)
#   what moved:  the msetup folder joined (15 suites), +143 assertions
#   commit:      b5003c62
# Update this block after every full run: a probe count (a narrowed
# registry) says nothing about the suites outside it and never belongs here.
# =============================================================================
# Single source of truth for the test suite AND the Codes-worksheet ListObjects.
#
# A generator reads this file and:
#   1. (re)creates and populates the Codes-sheet ListObjects -- "tests modules",
#      "general classes", "tests classes", etc. -- through Development class.
#   2. rebuilds the worksheet-scoped Name `ModulesForTesting`, which the test
#      runner (CustomTestImplementation.clickRibbonTests) iterates to decide
#      which modules to execute.
#
# A test module therefore runs only once it appears here AND the generator has
# repopulated the workbook. Add suites progressively -- that is by design.
#
# ----------------------------------------------------------------------------
# `folder` is the subfolder shared by every base path. For a suite folder F,
# components resolve to:
#     classes         -> src/classes/F/<name>.cls        (+ I<name>.cls if interface)
#     modules          -> src/modules/F/<name>.bas
#     tests[].module   -> src/tests/F/<module>.bas
#     fixtures         -> src/tests/F/<name>.cls          (imported as "tests classes")
#
# Test modules and their fixture classes now live TOGETHER in one per-suite
# folder, src/tests/F/. The former src/tests/modules/F + src/tests/classes/F
# split was retired: that extra "modules"/"classes" level clashed confusingly
# with the top-level src/modules and src/classes. The two tags below still
# differ (a .bas test imports as a module, a .cls fixture as a class); only the
# on-disk folder is now shared.
#
# The tag written above each generated table (read by Development.cls) is:
#     classes  -> "general classes"      modules  -> "general modules"
#     tests    -> "tests modules"        fixtures -> "tests classes"
# `interface: true` on a class also imports the matching I<name>.cls.
#
# ----------------------------------------------------------------------------
# NARROWING THIS FILE FOR A PROBE
#
# A session is verified by a probe: this registry narrowed to the work of that
# session, then the usual `run-tests.R --build`. A full run is about 27 minutes
# over 87 modules; a probe is two to four. The rule is `.obt/conventions.md`
# section 13 and `automated-testing-macos.md` section 1.1.
#
# Comment out the `- module:` rows under a non-helpers `tests:` key that the
# probe does not need, each one WITH its `covers:` continuation line -- comment
# one and leave the other and the YAML dies on a duplicate key. Leave every
# `classes:`, `modules:` and `fixtures:` row alone: the compile closure has to
# stay whole or the project does not build and the run answers the opaque -50.
# The whole `helpers` block below stays in every probe, `TestHelpersLite` above
# all, because every CustomTest module calls it.
#
# Restore with `git checkout -- src/tests/test-registry.yml`, so the file comes
# back byte-identical for any other session reading it. A NARROWED REGISTRY IS
# NEVER COMMITTED.
# ----------------------------------------------------------------------------
#
# `tests[].covers` is DOCUMENTATION ONLY. It records which production class(es)
# a test module exercises, so the test<->class mapping is visible at a glance
# (and available to a future coverage report). The generator does not read it:
# build-registry.R consumes only `tests[].module` (to emit the "tests modules"
# rows and the ModulesForTesting list). Adding, changing, or omitting `covers`
# never affects what is imported or run -- keep it accurate for humans, but it
# carries no build weight.
# =============================================================================

version: 1

suites:
  # --- helpers --------------------------------------------------------------
  # Shared test utilities (CustomTestSetTitles, BusyApp, EnsureWorksheet, ...)
  # that every CustomTest module calls. Registered so the runner imports it and
  # the test modules compile. The helper module has no @TestMethod, so
  # OBTRunAllTests runs it as a no-op (0 tests). Keep this suite in place.
  #
  # TestHelpersLite is the registered helper. It started as the subset TestOSFiles
  # needed and GROWS as suites are added: when a new test module wants a routine
  # the full TestHelpers already has, copy that routine in here rather than
  # switching the registration over.
  #
  # Only ONE helper module may be imported at a time -- the two define the same
  # Public names, and two live copies make every unqualified call "Ambiguous name
  # detected", which stops the whole project compiling and surfaces as the opaque
  # AppleScript -50. That is exactly the fault OBTImport.RemoveNonHeadlessModules
  # now sweeps: a stale full TestHelpers left in the saved workbook beside this
  # one. TestHelpers.bas stays on disk (79 test modules still call its richer
  # routines) but is deliberately NOT registered, so it is never imported.
  #
  # An earlier note here blamed TranslationObject + BetterArray being absent from
  # the workbook. That premise was wrong -- both classes are present.
  - folder: helpers
    tests:
      - module: TestHelpersLite
      - module: DictionaryTestFixture
      # LLFormatTestFixture is a .bas, so it is registered here as a helper
      # module. The `fixtures` tag would resolve it to src/tests/F/<name>.cls,
      # which it is not. Same shape as DictionaryTestFixture above.
      - module: LLFormatTestFixture
      # ChoicesTestFixture is the same shape again, and it is not optional:
      # TestLLChoices calls PrepareChoicesFixture, ChoicesFixtureHeaders,
      # ChoicesFixtureDistinctLists and ChoicesFixtureRowCount. Without it the
      # whole project fails to compile and the runner shows the opaque -50.
      - module: ChoicesTestFixture
      # PasswordsTestFixture lives beside the other .bas fixtures in
      # src/tests/helpers/, so it is registered here rather than under `general`
      # with the suites it serves. PreparePasswordsFixture is called by
      # TestPasswords, TestSetupErrors, TestEventSetup, TestSetupImport,
      # TestLLExport and TestDevelopment, so it stays registered whichever of
      # those are in the loop. It declares no @TestMethod, so the runner
      # imports it and runs it as a 0-test no-op.
      - module: PasswordsTestFixture
      # FormulaTestFixture is the same shape again. PrepareFormulaFixtureSheet
      # builds the two lookup ListObjects (T_XlsFonctions and T_ascii) that
      # FormulaData reads, and TestFormulas calls it. It declares no
      # @TestMethod, so the runner imports it and runs it as a 0-test no-op.
      - module: FormulaTestFixture
      # GeoTestFixture builds the nine geobase ListObjects LLGeo reads. These
      # routines were private to TestLLGeo until TestEventLinelistSheets needed
      # the same tables: LLdictionary.Prepare expands a geo variable into geo1
      # to geo4 columns ONLY when it is handed an LLGeo, so a suite that drives
      # the geo cascade of a generated linelist has to build a geobase first.
      # TestLLGeo now calls it too and keeps thin wrappers over its own names,
      # so its 34 direct uses of the two table utilities were left untouched.
      # It declares no @TestMethod, so the runner imports it and runs it as a
      # 0-test no-op.
      - module: GeoTestFixture
      # SetupImportTestFixture is the same shape again. It builds the
      # Dictionary, Choices, Exports, Analysis and Translations sheets that
      # TestSetupImport reads, and TestSetupErrors will call it too.
      - module: SetupImportTestFixture
      # AnalysisTestFixture is the same shape again. It builds the analysis
      # worksheets TestAnalysis reads -- PrepareAnalysisSheet,
      # PrepareFullAnalysisWorksheet, AnalysisTable, BuildAnalysisTable,
      # CreateAnalysisTranslator and ClearTestAnalysisSheets. Its helper calls
      # are unqualified, so they resolve to TestHelpersLite above. It declares
      # no @TestMethod, so the runner imports it and runs it as a 0-test no-op.
      - module: AnalysisTestFixture
    fixtures:
      # ProgressDisplayStub stands in for the progress label of the Imports
      # form. TestSetupImport declares one and SetupImport probes it for a
      # Caption or a Value. It went with the whole src/tests/stubs/ folder in
      # d6897661 and came back here, beside the other fixtures.
      - name: ProgressDisplayStub
      # LinelistDataStub stands in for the linelist specifications object that
      # CrossTable is handed at creation. CrossTable reads two members off it,
      # TransObject and Categories, and TableSpecs asks the second one on its
      # behalf. The real class is 1,536 lines and its closure names six more
      # classes across four folders, so the stub is what keeps the `analyses`
      # block to one new class row.
      - name: LinelistDataStub

  # --- general (OSFiles, DropdownLists) --------------------------------------
  # DropdownLists' whole dependency closure (HiddenNames, BetterArray, Checking)
  # is already in the workbook, so it needs no extra class imports.
  - folder: general
    classes:
      - name: OSFiles
      - name: DropdownLists
      # DataSheet and CustomTable each name the other only inside TypeName(...)
      # string tests and take their import argument As Object, so neither is a
      # compile dependency of the other and either can be imported on its own.
      # CustomTable is imported here because TestCustomTable needs it. The real
      # deps of both (Checking, BetterArray, HiddenNames, DropdownLists) are
      # already in the workbook.
      - name: DataSheet
      - name: CustomTable
      # ApplicationState compile-depends on ProjectError alone, which lives in
      # Checking and is already in the workbook.
      - name: ApplicationState
      # LLFormat needs CustomTable (Import and Export), Checking and BetterArray.
      # CustomTable is above and the other two are already in the workbook.
      - name: LLFormat
      # TemporaryRepos manages the working folder Prepare writes into. It names
      # ProjectError alone, which lives in Checking and is baked into the
      # workbook, so this row closes its own compile closure. It is here rather
      # than under `linelist` because a class row is resolved against
      # src/classes/<the suite folder>/ and this class lives in
      # src/classes/general/. LinelistSpecs holds one.
      - name: TemporaryRepos
      # Buttons draws the linelist's command shapes and gives each one its
      # action. It names LLFormat, which is above, plus Checking and BetterArray,
      # which are baked into the workbook, so this row closes its own compile
      # closure. It is here rather than under `linelist` because a class row is
      # resolved against src/classes/<the suite folder>/ and this class lives in
      # src/classes/general/. Linelist.PrepareAdmin and AnalysisOutput both hold
      # one, so neither of those two rows compiles without it. It carries no
      # suite of its own yet.
      - name: Buttons
      # ProgressBar draws the generation progress bar over a named range. It
      # names ProjectError alone, which lives in Checking and is baked into
      # the workbook, so this row closes its own compile closure. It is here
      # because the class lives in src/classes/general/;
      # EventsDesignerMulti under `designer` names it, so that module row
      # compiles through this one.
      - name: ProgressBar
      # Do NOT add TranslationObject as a class. It is already baked into the
      # workbook, and importing it again makes Excel keep both copies under a
      # second name (TranslationObject1). Only its TEST module is registered.
      # LLChoices needs DataSheet, CustomTable, TranslationObject, Checking and
      # BetterArray. The first three are above, the last two are in the
      # workbook.
      - name: LLChoices
      # Do NOT add Passwords as a class, for the same reason as TranslationObject
      # above. It is one of the classes imported BY HAND into the driver workbook
      # (see automated-testing-macos.md 4.1) because Development types
      # `As Passwords` and would not compile without it. Registering it made
      # ImportAll keep BOTH copies, the second one named Passwords1, and the
      # project stopped compiling -- the runner showed the opaque -50 with the
      # import log reporting "done". Refreshing the baked-in copy is a hand
      # re-import in the VBE, not a registry row.
    tests:
      - module: TestOSFiles
        covers: [OSFiles]
      - module: TestDropdownLists
        covers: [DropdownLists]
      - module: TestTranslationObject
        covers: [TranslationObject]
      - module: TestDataSheet
        covers: [DataSheet]
      - module: TestCustomTable
        covers: [CustomTable]
      # TestCustomTableTiming is a MEASURING TOOL, not a behaviour suite, and it
      # stays out of the loop on purpose. Every test in it times a call and logs
      # the seconds into the results, so it reports numbers rather than pass or
      # fail, and the numbers move with whatever else the machine is doing.
      # Uncomment the row below to measure, read the TIMING lines out of the
      # run CSV, then comment it back out. It answered where the wait went when
      # a resize on an HList sheet was slow: one Excel call per blank row, about
      # 2.5 ms each.
#      - module: TestCustomTableTiming
#        covers: [CustomTable]
      - module: TestApplicationState
        covers: [ApplicationState]
      - module: TestLLFormat
        covers: [LLFormat]
      - module: TestLLChoices
        covers: [LLChoices]
      # HiddenNames itself gets NO class row: it is one of the classes baked
      # into the driver workbook by hand, and importing it again would leave
      # Excel holding two copies under a second name. Only the test module is
      # registered, the same shape TranslationObject and Passwords have above.
      # A change to HiddenNames.cls reaches this suite through a hand re-import
      # in the VBE, so a green run here measures whichever copy the workbook
      # currently holds.
      - module: TestHiddenNames
        covers: [HiddenNames]
      # TestTemporaryRepos writes real files. Every test hands the factory a
      # base folder under ThisWorkbook.Path, because the default base is
      # Application.DefaultFilePath, which sits outside the granted folder.
      - module: TestTemporaryRepos
        covers: [TemporaryRepos]
      # TestPasswords was parked by owner decision for a while and is back in
      # the loop as of 2026-08-12. It drives the copy of Passwords baked into
      # the driver workbook, the same way TestHiddenNames and
      # TestTranslationObject do, so an edit to src/classes/general/Passwords.cls
      # reaches it only after a hand re-import in the VBE.
      # PasswordsTestFixture stays registered because five other suites use it.
      - module: TestPasswords
        covers: [Passwords]
      # TestProgressBar drives the bar over a hidden fixture sheet. The seam
      # test toggles Application.ScreenUpdating through the forced renders
      # and pins that every forced tick hands it back turned off.
      - module: TestProgressBar
        covers: [ProgressBar]
      # TestButtons drives the class that draws the linelist's command shapes:
      # the three values the factory stores, the one shape Add puts on the
      # sheet, the checking a repeated Add logs instead of a second shape, and
      # the two colours Format reads off an LLFormat design. Buttons has had a
      # class row above since the designer folder landed and this suite had
      # none, so its four tests sat on disk and had never run. It reaches
      # PrepareLLFormatFixture, FixtureCell and DeleteLLFormatFixture in
      # LLFormatTestFixture under `helpers`; its other helper calls are
      # unqualified, so they resolve to TestHelpersLite.
      - module: TestButtons
        covers: [Buttons]

      # FOUR MODULES IN src/tests/general/ ARE OUT OF THIS LIST ON PURPOSE, and
      # a green count here says nothing about any of them.
      #
      # TestManualOSFiles calls LoadFile, LoadFiles and LoadFolders, and each of
      # those opens the real platform picker. A dialog stops a headless run on a
      # modal, so this one is a hand check and must never be registered. Its own
      # header says so too.
      #
      # TestChecking, TestCheckingOutput and TestCustomTest build their assert
      # object with CreateObject("Rubberduck.AssertClass"), which is a COM class
      # this host does not have. They stay on the Rubberduck runner by owner
      # decision, so they are not registered either. Do NOT rewrite them to the
      # CustomTest harness to get them into the loop -- that decision was taken
      # on 2026-08-15 and is not an oversight waiting to be corrected.

  # --- dictionary (LLExport, LLSheets) ---------------------------------------
  # LLExport names LLdictionary, LLVariables, DataSheet, CustomTable, Passwords,
  # TranslationObject, Checking and BetterArray. DataSheet and CustomTable are
  # registered under `general` above; Passwords, TranslationObject, Checking and
  # BetterArray are baked into the driver workbook, so registering any of them
  # would leave Excel holding two copies and stop the project compiling.
  # LLdictionary and LLVariables are neither, so both are imported here.
  # LLSheets names LLdictionary, LLVariables, DataSheet and BetterArray, so the
  # three rows below already carry its closure.
  #
  # Every line-continuation underscore with a trailing space is gone from the
  # four classes in this folder (LLdictionary.AddMainSectionSort had three,
  # LLVariables had two). VBA rejects that shape, the whole project then fails
  # to compile, and the runner shows the opaque -50. Read the LogCompileProbe
  # inventory first on any -50 that follows a change here.
  - folder: dictionary
    classes:
      - name: LLdictionary
      - name: LLVariables
      - name: LLExport
      - name: LLSheets
    tests:
      - module: TestLLExport
        covers: [LLExport]
      - module: TestLLdictionary
        covers: [LLdictionary]
      - module: TestLLVariables
        covers: [LLVariables]
      - module: TestLLVariablesExtra
        covers: [LLVariables]
      - module: TestLLSheets
        covers: [LLSheets]
      - module: TestLLSheetsExtra
        covers: [LLSheets]

  # --- formulas (CaseWhen, ChoiceFormula, ValueOfFormula, FormulaData, ------
  #     FormulaCondition, Formulas) ----------------------------------------
  # The six classes form one chain. Formulas is the engine and names all five
  # others plus LLdictionary, LLVariables, LLSheets, Checking and BetterArray.
  # The three LL* classes are registered under `dictionary` above; Checking and
  # BetterArray are baked into the driver workbook, so registering either would
  # leave Excel holding two copies and stop the project compiling.
  # ChoiceFormula builds a CaseWhen, ValueOfFormula reads the dictionary
  # helpers, and FormulaData names ProjectError only.
  - folder: formulas
    classes:
      - name: CaseWhen
      - name: ChoiceFormula
      - name: ValueOfFormula
      - name: FormulaData
      - name: FormulaCondition
      - name: Formulas
    tests:
      - module: TestCaseWhen
        covers: [CaseWhen]
      - module: TestChoiceFormula
        covers: [ChoiceFormula]
      - module: TestValueOfFormula
        covers: [ValueOfFormula]
      - module: TestFormulaData
        covers: [FormulaData]
      - module: TestFormulaCondition
        covers: [FormulaCondition]
      - module: TestFormulas
        covers: [Formulas]

  # --- setup (SetupTranslationsTable) ---------------------------------------
  # This block is shared. The other four setup classes (UpdatedValues,
  # SetupImport, SetupPreparation, SetupErrors) add their rows here as
  # their own sessions land. Register a class only after confirming it is
  # absent from the saved driver workbook: the six classes baked in there are
  # BetterArray, Checking, Development, HiddenNames, Passwords and
  # TranslationObject, and importing a second copy of any of them stops the
  # project compiling and surfaces as the opaque -50.
  #
  # SetupTranslationsTable names ProjectError, ApplicationState, HiddenNames,
  # CustomTable and BetterArray. ApplicationState and CustomTable are
  # registered under `general` above; ProjectError lives in Checking, and
  # Checking, HiddenNames and BetterArray are baked into the workbook. So the
  # one class row below closes its own compile closure.
  #
  # SetupImport names ProjectError, ApplicationState, BetterArray,
  # CustomTable, DataSheet, HiddenNames, LLChoices, LLdictionary, LLExport,
  # LLFormat, OSFiles, Passwords, Analysis and SetupTranslationsTable.
  # ApplicationState, CustomTable, DataSheet, LLChoices, LLFormat and OSFiles
  # are registered under `general`; LLdictionary and LLExport under
  # `dictionary`; SetupTranslationsTable is right below; Analysis has its own
  # `analyses` block further down; and Passwords, BetterArray, HiddenNames and
  # Checking are baked into the workbook.
  #
  # UpdatedValues names ProjectError alone, which lives in Checking, and
  # Checking is baked into the workbook. So its class row closes its own
  # compile closure and brings nothing else with it.
  - folder: setup
    classes:
      - name: SetupTranslationsTable
      - name: SetupImport
      - name: UpdatedValues
      # SetupPreparation names BetterArray, DropdownLists, UpdatedValues,
      # CustomTable, Checking and Development. DropdownLists and CustomTable
      # are in the `general` block, UpdatedValues is above, and BetterArray,
      # Checking and Development are baked into the driver workbook.
      # Development must NOT be registered: it is what builds the Codes-sheet
      # tables the runner reads, so a second copy stops the project compiling.
      - name: SetupPreparation
      # SetupErrors names Analysis, ApplicationState, BetterArray, Checking,
      # CheckingOutput, ChoiceFormula, CustomTable, FormulaData, Formulas,
      # LLChoices, LLVariables, LLdictionary, Passwords, SetupTranslationsTable
      # and TableSpecs. ApplicationState, CustomTable and LLChoices are under
      # `general`; LLdictionary and LLVariables under `dictionary`;
      # ChoiceFormula, FormulaData and Formulas under `formulas`; Analysis and
      # TableSpecs under `analyses`; SetupTranslationsTable is above. Checking,
      # CheckingOutput, BetterArray and Passwords are baked into the driver
      # workbook. CheckingOutput belongs to that hand-import list too (it is in
      # the 4.1 closure of automated-testing-macos.md and the component
      # inventory shows it at 1247 lines), so it gets no class row here.
      - name: SetupErrors
      # EventSetup names Analysis, BetterArray, ChoiceFormula, CustomTable,
      # DropdownLists, HiddenNames, LLChoices, LLExport, LLVariables,
      # LLdictionary, Passwords, TranslationObject and UpdatedValues.
      # CustomTable, DropdownLists and LLChoices are under `general`;
      # LLdictionary, LLExport and LLVariables under `dictionary`;
      # ChoiceFormula under `formulas`; Analysis under `analyses`;
      # UpdatedValues is above. BetterArray, HiddenNames, Passwords and
      # TranslationObject are baked into the driver workbook and must not be
      # registered.
      #
      # It also calls RibbonDev.ActualRibbon, which is a MODULE and was missing
      # from every closure list because those only counted classes. RibbonDev is
      # registered under `folder: dev` below; without it the project does not
      # compile and the runner shows the opaque -50.
      - name: EventSetup
    modules:
      # EventsManager holds the single EventSetup instance and the
      # busy-state counter, which is why it is a module and not a class:
      # module-level state is what ribbon callbacks and worksheet functions both
      # reach. TestEventsManager drives the counter, the nesting and the
      # snapshot round trip, so the module has to be in the workbook.
      # It names EventSetup (above), ApplicationState (`general`) and
      # HiddenNames (baked in). Its public names clash with nothing already in
      # the workbook: LinelistEventsManager under `linelist` covers the same six
      # jobs and carries an LL prefix on every one of them.
      - EventsManager
    tests:
      - module: TestSetupTranslationsTable
        covers: [SetupTranslationsTable]
      - module: TestUpdatedValues
        covers: [UpdatedValues]
      - module: TestSetupPreparation
        covers: [SetupPreparation]
      # TestSetupErrors builds its workbook through SetupImportTestFixture,
      # PasswordsTestFixture and FormulaTestFixture, all three registered under
      # `helpers`. Its helper calls are unqualified, so they resolve to
      # TestHelpersLite.
      - module: TestSetupErrors
        covers: [SetupErrors]
      # TestSetupImport is heavy: 38 tests, 137 assertions, and even after
      # Session 25 cut its churn to 9 exports and 4 opens it is the single
      # costliest module in the loop.
      #
      # It spent a long time parked. Session 34 added TestEventSetup and
      # TestEventsManager, and the full 37-module run then sat on the runner's
      # 600-second Apple Events cap -- one run wrote its results and the next
      # two returned nothing at all -- so this row was commented out to get
      # back under the cap. The cap is 3600 seconds now, and the whole reason
      # is gone with it: the 87-module run this row rejoined came in around 27
      # minutes, green.
      #
      # SetupImportTestFixture, PasswordsTestFixture and ProgressDisplayStub
      # all stay registered.
      - module: TestSetupImport
        covers: [SetupImport]
      # TestEventSetup builds its own fixture workbook and calls
      # PreparePasswordsFixture from PasswordsTestFixture under `helpers`. Its
      # helper calls are unqualified, so they resolve to TestHelpersLite.
      - module: TestEventSetup
        covers: [EventSetup]
      - module: TestEventsManager
        covers: [EventsManager]

  # --- analyses (Analysis) ---------------------------------------------------
  # Opened by SetupImport, which names Analysis and cannot reach it from
  # the `setup` block: the registry resolves `classes` to src/classes/<folder>/
  # and Analysis lives in src/classes/analyses/. TestAnalysis joined it after,
  # and AnalysisTestFixture is a .bas, so it sits under `helpers` with the
  # other fixture modules. Whoever adds TableSpecs and TestTableSpecs joins
  # this block rather than opening a second one.
  # Analysis names CustomTable, Checking, TranslationObject and BetterArray:
  # CustomTable is registered under `general` and the other three are baked
  # into the workbook, so the rows below close their own compile closure.
  # TestAnalysis adds CustomTest, which is baked in too.
  #
  # TableSpecs names LLdictionary, LLVariables and BetterArray. The first two
  # are registered under `dictionary` and BetterArray is baked into the
  # workbook, so its class row closes its own compile closure. LinelistSpecs
  # is reached through a TypeName string alone, so it is no compile
  # dependency. TestTableSpecs adds CustomTest, baked in too, and reaches
  # PrepareDictionaryFixture in DictionaryTestFixture under `helpers`.
  #
  # CrossTable names TableSpecs, LLVariables, LLFormat, TranslationObject,
  # HiddenNames, BetterArray and Checking. TableSpecs sits above, LLVariables
  # is registered under `dictionary`, LLFormat under `general`, and the last
  # four are baked into the workbook, so its class row closes its own compile
  # closure and this block opens no other folder. The whole AnalysisScope enum
  # its Format reads lives in LLFormat, so that one row carries it too.
  #
  # The linelist specifications are NOT in that list, and that is the reason
  # this block stays this size. CrossTable.Create types the parameter Object
  # and reads two members off it at run time, the same way
  # TableSpecs.RowCategories does. Registering LinelistSpecs instead would pull
  # in LLTranslation, LLGeo, DesignerTranslation, InitTransfer and
  # TemporaryRepos across four more folders. TestCrossTable hands over
  # LinelistDataStub, registered under `helpers`.
  #
  # AnalysisRanges names nothing at all. It holds one string and answers the
  # named-range strings built from it, so its class row is a leaf and closes
  # its own compile closure on its own. Its ThrowError reaches ProjectError,
  # which lives in Checking, and Checking is baked into the workbook. That is
  # also what makes it cheap for Linelist.TransferAllCode to carry, so the
  # generated linelist and this builder can share one definition of every name.
  #
  # CrossTableFormula names CrossTable, TableSpecs, FormulaData, Formulas,
  # FormulaCondition, SpatialTables, AnalysisRanges, Checking and BetterArray.
  # CrossTable, TableSpecs, AnalysisRanges and SpatialTables sit in this block,
  # FormulaData, Formulas and FormulaCondition are registered under `formulas`,
  # and Checking and BetterArray are baked into the workbook. So the pair of
  # rows below closes its own compile closure and opens no other folder.
  #
  # SpatialTables names CrossTable, TableSpecs, Formulas, FormulaBuilder and
  # Checking, all of them either in this block or baked into the workbook. Its
  # suite moved from src/tests/geo/ to src/tests/analyses/ and joined this
  # block: the registry resolves a test module to src/tests/<folder>/, the class
  # lives in src/classes/analyses/, and registering `geo` instead would split
  # the analysis subsystem coverage over two folders.
  #
  # FormulaBuilder names Formulas, FormulaCondition, Checking and BetterArray.
  # Formulas and FormulaCondition are registered under `formulas` and the last
  # two are baked into the workbook, so its class row closes its own compile
  # closure. It holds the criteria of one formula, asks the parser for the text
  # and writes it into the cell, and CrossTableFormula and SpatialTables both
  # write through one, so the row has to come with both of them.
  #
  # AnaTabIds names Graphs alone, and Graphs names Checking, which is baked into
  # the workbook. AnaTabIds also owns the AnalysisScope enum: it is the leaf that
  # routes on the value, and the generated linelist carries this class and the
  # export without carrying AnalysisOutput, so the definition has to live here.
  #
  # Graphs is NOT in the row list below. The runner resolves a class row to
  # src/classes/<the suite folder>/, and Graphs lives in src/classes/graphs/, so
  # a row here stages no file at all and the import wedges with no message. It
  # gets its own `graphs` block further down.
  #
  # TestAnalysisOutput stays out until AnalysisOutput has a class row of its own.
  # LinelistSpecs is registered under `linelist` below, so that half of the wall
  # is down, and the three classes GraphSpecs was split into -- SeriesBuffer,
  # GraphSeries and TimeSeriesGraphs, all typed by AnalysisOutput -- have rows
  # under `graphs` now. What AnalysisOutput still waits on is Linelist: it
  # holds `anaLL As Linelist` and its factory takes `ByVal ll As Linelist`, both
  # typed. That row belongs to the Linelist session.
  - folder: analyses
    classes:
      - name: Analysis
      - name: AnalysisRanges
      - name: TableSpecs
      - name: CrossTable
      - name: FormulaBuilder
      - name: SpatialTables
      - name: CrossTableFormula
      - name: AnaTabIds
      # TemporalSection holds the date bounds and the headers of one temporal
      # analysis section. It names BetterArray alone, which is baked into the
      # workbook, so it adds no folder to this block.
      - name: TemporalSection
      # CustomPivotTable stacks one titled PivotTable block per data-entry sheet
      # on the custom pivot worksheet. It names LLFormat, HiddenNames and
      # Checking (for ProjectError). LLFormat is registered under `general`;
      # HiddenNames, Checking and BetterArray are baked into the driver workbook
      # and must not be registered. So this row closes its own compile closure
      # and brings no new folder with it.
      #
      # Its test module used to live in src/tests/tables/, which no suite could
      # ever name: a suite resolves classes AND tests against one folder, and
      # the class sits in src/classes/analyses/. Moving the module here is what
      # made registration possible, and src/tests/tables/ is now gone.
      - name: CustomPivotTable
      # AnalysisOutput writes every analysis sheet of a linelist. It holds
      # `anaLL As Linelist` and its factory takes `ByVal ll As Linelist`, both
      # typed, so it could not be registered until Linelist had a row -- which
      # is the row added under `linelist` in the same commit. Everything else it
      # names is registered already: TableSpecs, CrossTable, CrossTableFormula,
      # Graphs, SeriesBuffer, GraphSeries, TimeSeriesGraphs, AnaTabIds and
      # TemporalSection here or under `graphs`, LLFormat, DropdownLists,
      # ApplicationState and Buttons under `general` -- ApplicationState is what
      # WriteAnalysis opens its busy state on, since Session 97 --,
      # LLdictionary, LLVariables and LLExport under
      # `dictionary`, FormulaData under `formulas`, LinelistSpecs under
      # `linelist`. TranslationObject, Passwords, HiddenNames, Checking and
      # BetterArray are baked into the driver workbook.
      #
      # This row closes the analyses folder.
      - name: AnalysisOutput
    tests:
      - module: TestAnalysis
        covers: [Analysis]
      - module: TestAnalysisRanges
        covers: [AnalysisRanges]
      - module: TestTableSpecs
        covers: [TableSpecs]
      - module: TestCrossTable
        covers: [CrossTable]
      - module: TestCrossTableFormula
        covers: [CrossTableFormula]
      # TestFormulaBuilder reaches PrepareDictionaryFixture in
      # DictionaryTestFixture and PrepareFormulaFixtureSheet in
      # FormulaTestFixture, both registered under `helpers`. Its helper calls are
      # unqualified, so they resolve to TestHelpersLite.
      - module: TestFormulaBuilder
        covers: [FormulaBuilder]
      # TestSpatialTables builds a real Tab_Spatial_Analysis fixture, a
      # CrossTable on an output worksheet and a linelist for the formulas to
      # point at, the same way TestCrossTableFormula does. It hands over
      # LinelistDataStub, registered under `helpers`.
      - module: TestSpatialTables
        covers: [SpatialTables]
      # TestAnaTabIds builds three sheets: one for the registry table, one
      # standing in for an analysis sheet with its named ranges, and a visible
      # one standing in for the sheet the export writes. The output sheet has to
      # be selectable because WriteGraphs calls Application.GoTo.
      - module: TestAnaTabIds
        covers: [AnaTabIds]
      # TestTemporalSection needs no fixture at all: the class it drives holds
      # strings and a list, so the suite runs with no workbook, no linelist and
      # no dictionary.
      - module: TestTemporalSection
        covers: [TemporalSection]
      # TestCustomPivotTable builds its own workbook with a ListObject to pivot
      # over and an empty sheet to stack blocks on, through NewWorkbook,
      # DeleteWorkbook and EnsureWorksheet. Those calls are UNQUALIFIED so they
      # resolve to TestHelpersLite; the module shipped with them written
      # `TestHelpers.` and that never compiles, because the full TestHelpers is
      # deliberately never imported. It also reaches PrepareLLFormatFixture
      # under `helpers` for the tests that drive Format against a real LLFormat.
      - module: TestCustomPivotTable
        covers: [CustomPivotTable]
      # TestAnalysisOutput builds a complete linelist workbook -- the analysis
      # setup ListObjects, the four output worksheets, the translation tables,
      # the formula data and a prepared dictionary -- and runs
      # WriteAnalysis at the time series stage through RunTimeSeriesBuild. Four
      # of its tests read the section loop back out of that build, and one reads
      # the application state after it. Its lifecycle hooks shipped Private,
      # which Application.Run cannot reach, and they are Public here.
      # Registering it is what gives the class its first compile.
      #
      # This comment used to read "reaches the two Create rejections and nothing
      # else", which was true when the row was added and stopped being true when
      # the section-loop tests landed. A stale coverage note is worse than none:
      # Session 97 believed it over the module and reported the probe as blind
      # to WriteAnalysis when it had just run it.
      - module: TestAnalysisOutput
        covers: [AnalysisOutput]

  # --- graphs (Graphs, SeriesBuffer, GraphSeries, TimeSeriesGraphs) ----------
  # A class row is resolved against src/classes/<folder>/, so every class here
  # needs a block naming its own folder.
  #
  # Graphs wraps one Excel ChartObject and names Checking alone, which is baked
  # into the workbook. AnaTabIds compiles against it.
  #
  # GraphSpecs was split into three on 2026-07-31 and deleted. SeriesBuffer
  # holds one chart's worth of series and names BetterArray and Checking, both
  # baked in. GraphSeries answers the series of one built cross-table and names
  # CrossTable and TableSpecs (registered under `analyses`) plus SeriesBuffer.
  # TimeSeriesGraphs reads the three time series setup tables and names
  # TableSpecs, LinelistSpecs (under `linelist`) and SeriesBuffer. So the block
  # closes its own compile closure and waits on nothing. AnalysisOutput types
  # all three, so they are also part of what that class needs before it can be
  # registered.
  #
  # SeriesBuffer comes first: the other two hold one.
  - folder: graphs
    classes:
      - name: Graphs
      - name: SeriesBuffer
      - name: GraphSeries
      - name: TimeSeriesGraphs
    tests:
      # TestSeriesBuffer runs against plain values, which makes it the cheapest
      # suite in the folder.
      #
      # TestGraphSeries and TestTimeSeriesGraphs came out of TestGraphSpecs,
      # which covered both halves of the class that was split. They build their
      # fixture tables under the names the setup workbook gives them, so each
      # one frees the name before it claims it. They reach
      # DictionaryTestFixture, registered under `helpers`; their other helper
      # calls are unqualified, so they resolve to TestHelpersLite.
      #
      # TestGraphs was rewritten to the CustomTest harness on 2026-07-31. The
      # version before it carried Option Private Module, kept every test proc
      # Private, and built its assert object with
      # CreateObject("Rubberduck.AssertClass") plus Rubberduck.FakesProvider,
      # which is a COM class this host does not have. It draws real charts on a
      # fixture worksheet, so read the clock after adding it.
      - module: TestSeriesBuffer
        covers: [SeriesBuffer]
      - module: TestGraphSeries
        covers: [GraphSeries]
      - module: TestTimeSeriesGraphs
        covers: [TimeSeriesGraphs]
      - module: TestGraphs
        covers: [Graphs]

  # --- geo (LLGeo, for LinelistSpecs) ----------------------------------------
  # LLGeo owns the Geo worksheet: the four admin tables, the health facility
  # table, the level-name translations and the metadata table. LinelistSpecs
  # holds one and InitTransfer returns one, so it travels with them.
  #
  # It names BetterArray, HiddenNames, Passwords and Checking, all baked into
  # the driver workbook, plus LLdictionary and LLVariables (registered under
  # `dictionary`) and CustomTable and DropdownLists (registered under
  # `general`). So this one row closes its own compile closure.
  #
  # TestLLGeo joined the block on 2026-07-31. It declares CustomTest, LLGeo,
  # BetterArray, HiddenNames and Passwords, all of them either the row below or
  # baked into the driver workbook. It reaches PreparePasswordsFixture in
  # PasswordsTestFixture, registered under `helpers`; its other helper calls are
  # unqualified, so they resolve to TestHelpersLite.
  #
  # Two of its tests build a workbook of their own, because Update walks every
  # worksheet of the workbook that owns the geo sheet and the driver workbook
  # carries dozens.
  #
  # LLSpatial and TestLLSpatial joined the block on 2026-07-31, which is the
  # whole of src/tests/geo/. LLSpatial names BetterArray, HiddenNames and
  # Checking, all three baked into the driver workbook, so its row closes its own
  # compile closure too. TestLLSpatial declares CustomTest, LLSpatial,
  # HiddenNames and BetterArray, and its helper calls are unqualified.
  #
  # Most of its tests build a workbook of their own, for the same reason the
  # LLGeo ones do: Update walks every worksheet of the workbook that owns the
  # spatial sheet.
  #
  # GeoFormCache joined on 2026-08-09: the in-memory lists of the geo form,
  # read once per form open and searched per keystroke. It names BetterArray
  # and Checking, both baked in, and the GeoScope enum on LLGeo right above,
  # so its row opens nothing further. Every TestGeoFormCache fixture is a
  # workbook of its own, because the fixture names (adm4_concat and its three
  # siblings) would collide with the LLGeo fixtures in this workbook.
  - folder: geo
    classes:
      - name: LLGeo
      - name: LLSpatial
      - name: GeoFormCache
    tests:
      - module: TestLLGeo
        covers: [LLGeo]
      - module: TestLLSpatial
        covers: [LLSpatial]
      - module: TestGeoFormCache
        covers: [GeoFormCache]

  # --- designer (DesignerPreparation, DesignerEntry, DesignerTranslation) ---
  # LinelistSpecs.Prepare calls InitTransfer.TransferToLinelist and its seven
  # manager builders, so the module has to be in the workbook. A module row is
  # resolved against src/modules/<the suite folder>/, so it needs a block
  # naming its own folder.
  #
  # It replaced the LLBuild class on 2026-07-31, and the row moved from
  # `classes` to `modules` with it. The class held its seven exported managers
  # in a UDT only to carry them from one method call to the next, and
  # LinelistSpecs.Prepare, its one caller, copied all seven out again the
  # moment they were built.
  #
  # InitTransfer names Analysis, LLChoices, LLExport, LLFormat, LLGeo,
  # LLTranslation, LLdictionary, Passwords and HiddenNames. LLGeo is right
  # above, LLTranslation is under `linelist` below, Analysis is under
  # `analyses`, and the rest are already registered or baked in. So this one
  # row opens nothing further. Its nine public names clash with nothing already
  # in the driver workbook.
  #
  # The three designer classes joined on 2026-08-12 with the block's first two
  # suites. DesignerPreparation names HiddenNames, Development, BetterArray and
  # Checking (all baked into the driver workbook) plus OSFiles, CustomTable and
  # DropdownLists (under `general`). DesignerEntry names DesignerTranslation,
  # which names TranslationObject, BetterArray, HiddenNames and CustomTable. So
  # these rows open nothing further.
  #
  # The folder registered whole on 2026-08-13: the four event modules and the
  # three remaining suites joined. The module closure adds one class row,
  # ProgressBar under `general`; everything else the four modules name is
  # registered already (LinelistSpecs, Linelist, LLDataEntry, LLSheets,
  # AnalysisOutput, DropdownLists, OSFiles, CustomTable, ApplicationState,
  # LLFormat, LLGeo, SetupTranslationsTable, RibbonDev under `dev`) or baked
  # into the driver workbook (Checking, CheckingOutput, BetterArray,
  # HiddenNames, Passwords). The ribbon callbacks compile against
  # IRibbonControl from the Office library, the same way the setup event
  # modules do. The mastersetup modules also declare LangLabel and
  # clickLangChange, and they stay unregistered; registering that folder
  # later has to rename one side first (the Session 51 ambiguous-name
  # lesson).
  - folder: designer
    # EventsDesignerAdvanced and EventsDesignerMulti read the setup language
    # key through SetupTranslationsTable.LanguagesNameId; the class is
    # registered under `setup`, so the closure is whole. The designer
    # BINARIES need the class in their Dev import table before the next code
    # reimport, and ProgressBar with it.
    classes:
      - name: DesignerTranslation
      - name: DesignerEntry
      - name: DesignerPreparation
      # GenerationLog owns the record of one run and writes the __check
      # report. It names LinelistSpecs (under `linelist`) plus Checking,
      # CheckingOutput, HiddenNames and BetterArray (baked in), so the row
      # opens nothing further. It replaced the GenerationReport module on
      # 2026-08-13, and the row moved from `modules` to `classes` with it.
      - name: GenerationLog
    modules:
      - InitTransfer
      # EventsDesignerCore holds the session's entry-and-translator pair;
      # EventsDesignerAdvanced carries the build core (GenerateOne,
      # ValidateEntries, SetupLanguages) and holds the run log;
      # EventsDesignerMulti drives T_Multi and the multi build loop.
      - EventsDesignerCore
      - EventsDesignerAdvanced
      - EventsDesignerMulti
    tests:
      - module: TestDesignerPreparation
        covers: [DesignerPreparation]
      - module: TestDesignerEntry
        covers: [DesignerEntry]
      - module: TestDesignerTranslation
        covers: [DesignerTranslation]
      - module: TestInitTransfer
        covers: [InitTransfer]
      - module: TestDesignerMulti
        covers: [EventsDesignerMulti, EventsDesignerAdvanced]
      - module: TestGenerationLog
        covers: [GenerationLog]

  # --- headless (HeadlessBuild) ---------------------------------------------
  # The headless workflow: fill a setup from another setup, then build a
  # linelist, both with no designer and no dialog. HeadlessBuild takes every
  # path as a parameter and answers a string outcome, because its callers are
  # a suite today and an R package later, and neither can read a dialog.
  #
  # The setup import is INJECTED into the target workbook rather than called
  # from here: SetupImport resolves its destination as ThisWorkbook, so a call
  # from the driver would import the source into the driver. The injected
  # module is scripts/headless/vba/OBTSetupImportHeadless.bas, read off disk at
  # run time and never registered.
  #
  # HeadlessBuild names DesignerPreparation, under `designer` below. It calls
  # EnsureGeoFlags on the designer copy before the generation, because a
  # designer that never went through DesignerPreparation.Prepare carries none of
  # the hidden names LLGeo requires and every geo variable then stays one column
  # instead of the twelve it expands into. A NARROWED registry probe over this
  # folder has to keep the designer row for that reason: without it the driver
  # workbook does not compile.
  - folder: headless
    modules:
      - HeadlessBuild
    tests:
      - module: TestHeadlessSetupFill
        covers: [HeadlessBuild]
      # The generation, end to end and with no designer machinery. It is the
      # only suite that runs Linelist.Prepare to completion, because the code
      # transfer needs a source project carrying the ten forms and the driver
      # workbook carries none. Its forms come from .test-runner/forms/merged,
      # written by scripts/headless/merge-form-code.R -- run that script before
      # the harness or the suite reports the folder as missing.
      - module: TestHeadlessLinelistBuild
        covers: [HeadlessBuild]

  # --- linelist (LinelistSpecs, LLTranslation) -------------------------------
  # THIS IS THE FIRST TIME EITHER CLASS HAS BEEN COMPILED. The whole generation
  # path sat in the expansion backlog below, so LinelistSpecs, Linelist,
  # LLDataEntry, CodeTransfer and LLTranslation were never
  # imported and the green baseline said nothing about any of them.
  #
  # LinelistSpecs is the facade over the designer's seven required sheets, and
  # after Prepare it is the handle on the linelist's domain managers. Its
  # closure is five rows across four blocks: these two classes, plus LLGeo
  # under `geo`, the InitTransfer module under `designer`, and
  # TemporaryRepos under `general`. Everything else LINELISTSPECS names is
  # registered already (Analysis, ApplicationState, FormulaData, Formulas,
  # LLChoices, LLExport, LLFormat, LLVariables, LLdictionary) or baked into the
  # driver workbook (BetterArray, Checking, HiddenNames, Passwords,
  # TranslationObject). That list belongs to LinelistSpecs alone.
  #
  # LLTranslation names four collaborators: CustomTable (under `general`),
  # BetterArray, HiddenNames and TranslationObject (all baked in). It never
  # names LLdictionary. Its Tab_Translations table is the SETUP's translation
  # table, which is a different thing from the linelist dictionary.
  #
  # CodeTransfer moves the VBA components of a generation into the output
  # workbook, and this row is the first time it has been compiled. Its whole
  # closure is TemporaryRepos, registered under `general`, and Checking, baked
  # into the driver workbook, so the row opens nothing further. Linelist takes a
  # typed CodeTransfer parameter, which means the dependency runs one way and
  # this row can land on its own.
  #
  # LLDataEntry builds one data entry worksheet per dictionary sheet name, and
  # this row is the first time it has been compiled. It was the most expensive
  # row of the generation tree while it still opened the `sections` folder
  # through SectionBuilder and VarWriter. Session 47 registered both of those,
  # and CustomPivotTable landed under `analyses` the same day, so the closure is
  # this row alone: everything else it names has one already -- Linelist and
  # LinelistSpecs here, LLSheets and LLdictionary under `dictionary`, LLFormat,
  # DropdownLists and Buttons under `general`, CustomPivotTable under
  # `analyses`, SectionBuilder under `sections`, LLGeo under `geo`. Passwords,
  # TranslationObject, HiddenNames, Checking and BetterArray are baked into the
  # driver workbook.
  - folder: linelist
    classes:
      - name: LinelistSpecs
      - name: LLTranslation
      - name: CodeTransfer
      # Linelist builds the output workbook. It names LinelistSpecs and
      # CodeTransfer above, LLdictionary, LLVariables and LLSheets under
      # `dictionary`, LLFormat, DropdownLists, TemporaryRepos and Buttons under
      # `general`, CustomPivotTable and AnaTabIds under `analyses`. Passwords,
      # TranslationObject, HiddenNames, Checking and BetterArray are baked into
      # the driver workbook. AnalysisOutput waited on this row.
      - name: Linelist
      - name: LLDataEntry
      # EventLinelist routes every event of a generated linelist. Session 51
      # tried this row and had to back it out: LinelistEventsManager declared
      # the same six Public names as EventsManager under `setup`, and two live
      # copies of a Public name make every UNQUALIFIED call to it "Ambiguous
      # name detected". TestEventsManager makes exactly such a call, so the
      # whole project stopped compiling and the run wedged on the dialog --
      # healthy import log, a zero-byte test-results.csv, Excel ignoring the
      # graceful quit. The linelist side of each pair now carries an LL prefix
      # (LLEnterBusyState, LLExitBusyState, LLIsBusyState, LLWorkbookOpened,
      # LLSheetActivated, LLSheetChanged), so the two managers share no name and
      # all three rows below can live here.
      #
      # THIS IS THE FIRST TIME ANY OF THE THREE HAS BEEN COMPILED. The closure
      # opens nothing new. EventLinelist names DropdownLists (`general`), LLGeo
      # and LLSpatial (`geo`), LLdictionary and LLVariables (`dictionary`) and
      # LLTranslation above; BetterArray, Checking, HiddenNames, Passwords and
      # TranslationObject are baked into the driver workbook.
      #
      # ONE THING HAD TO MOVE BEFORE THIS ROW COULD LAND. OnDoubleClick used to
      # call GeoModule.LoadGeo, and GeoModule can never be registered: it drives
      # the F_Geo UserForm, no .frm lives under src/, and this schema has no
      # forms key. So OnDoubleClick now ANSWERS the geo scope the click asked
      # for and EventLinelistWorkbook makes the call. That module carries the
      # worksheet event handlers, is never registered, and travels into the
      # generated linelist beside GeoModule and F_Geo, so the call still binds
      # at run time. Modules call modules, which is what the house rule wants.
      - name: EventLinelist
      # LLLog keeps the dated user-action log of a running linelist on the
      # very hidden __log worksheet, one Checking bundle per event flushed
      # through CheckingOutput. It names Checking, CheckingOutput, HiddenNames
      # and BetterArray, all baked into the driver workbook, so this row
      # closes its own compile closure.
      - name: LLLog
    modules:
      # LinelistEventsManager holds the single EventLinelist instance and the
      # busy-state counter, which is why it is a module: module-level state is
      # what worksheet event handlers and worksheet functions both reach. It
      # names EventLinelist above, ApplicationState (`general`),
      # CustomLinelistFunctions below, and HiddenNames, which is baked in.
      - LinelistEventsManager
      # CustomLinelistFunctions carries the worksheet functions a generated
      # linelist puts in cell formulas -- EPIWEEK, VALUE_OF, GEOCONCAT,
      # DATE_RANGE and the rest. It reaches EventLinelist through
      # LinelistEventsManager above and names nothing else. Its eighteen public
      # names clash with nothing already in the workbook.
      - CustomLinelistFunctions
    tests:
      # TestCustomLinelistFunctions closes issue 340, which reported EPIWEEK
      # answering week 53 for 29 to 31 December 2025. The implementation that
      # behaved that way was replaced in February 2026 and nothing proved the
      # replacement, because src/modules/linelist/ had no registry row at all.
      # The module declares its own DropWorkbookName and SetWorkbookName, and
      # its other helper calls are unqualified so they resolve to
      # TestHelpersLite. The aggregation tests build the shared time unit
      # dropdown, so they also name DropdownLists, registered under `general`.
      - module: TestCustomLinelistFunctions
        covers: [CustomLinelistFunctions]
      # TestLinelistSpecs moved here from the src/tests/ root, where it had no
      # folder to be registered under. Its four tests had never run.
      - module: TestLinelistSpecs
        covers: [LinelistSpecs]
      # TestLLTranslation builds a workbook carrying the five translation
      # tables and the two language codes. It reaches no fixture module; its
      # helper calls are unqualified, so they resolve to TestHelpersLite.
      - module: TestLLTranslation
        covers: [LLTranslation]
      # TestCodeTransfer adds a standard module and a class module to a fresh
      # workbook through VBComponents.Add, then moves them into a second one.
      # The runner already needs "Trust access to the VBA project object model"
      # for its own import, so the capability is there; a run without it makes
      # every test of this module report the setup error rather than wedging.
      # Its repository sits under ThisWorkbook.Path, because the default base is
      # Application.DefaultFilePath, outside the folder the run is granted.
      - module: TestCodeTransfer
        covers: [CodeTransfer]
      # TestLinelist builds one designer-shaped workbook and one workbook
      # standing in for the linelist, both once per module, and hands the second
      # one over through LinelistSpecs.TestAssignLLWorkbook. That is what lets it
      # drive AddOutputSheet, the three worksheet accessors, the scoped-name cut
      # and the two memoised managers without running a generation. Its helper
      # calls are unqualified, so they resolve to TestHelpersLite, and it reaches
      # PrepareDictionaryFixture in DictionaryTestFixture under `helpers`.
      - module: TestLinelist
        covers: [Linelist]
      # TestLLDataEntry builds one designer-shaped workbook and one workbook
      # standing in for the linelist, both once per module, then builds the
      # VList sheet and the HList sheet once each and asserts over what they
      # hold. Building a data entry sheet writes every label, dropdown and
      # conditional format of that sheet, so a build per test is what put the
      # sections folder on the runner cap. It reaches PrepareDictionaryFixture,
      # PrepareChoicesFixture, PrepareLLFormatFixture,
      # PrepareFormulaFixtureSheet and PreparePasswordsFixture under `helpers`,
      # and its helper calls are unqualified so they resolve to TestHelpersLite.
      - module: TestLLDataEntry
        covers: [LLDataEntry]
      # TestEventLinelist drives the class every event of a generated linelist
      # comes through. It aims at the held managers and the flags that guard
      # them: the translation helper is the one manager with a public reader, so
      # the "built once, and a failed build is not retried" rule is measured
      # through it, with ResetCaches as the other half. The deactivate tests
      # cover a shipped bug -- the workbook hidden name store used to be
      # assigned below the exit taken when the LinelistTranslation worksheet is
      # missing, so the list-auto flag was never cleared on such a workbook.
      # GeoManager gives that same rule a second reader, over a manager whose
      # build reads a worksheet carrying nine ListObjects, and two of its tests
      # cover the reported caption bug: LLGeo caches the five admin level labels
      # per instance, so a held manager answers the labels of the geobase an
      # import has already replaced, and ResetCaches is what refreshes it.
      # The fixture is a bare workbook per test, seeded with the five
      # translation tables by the tests that want them, seeded with a geobase by
      # the geo manager tests, and seeded part way through by the test that
      # measures the flag. Every test builds a workbook of its own and writing a
      # ListObject into it brings it to the front, so both cleanup hooks hand
      # the screen back with ThisWorkbook.Activate: PrintResults raises 1004
      # while another workbook holds it, and that raise is a modal that stops
      # the whole run. It reaches PrepareGeoFixture and GeoFixtureWriteCell in
      # GeoTestFixture under `helpers`; its other helper calls are unqualified,
      # so they resolve to TestHelpersLite.
      - module: TestEventLinelist
        covers: [EventLinelist]
      # TestEventLinelistSheets drives the four heavy members of EventLinelist
      # -- OnSheetChange, OnSelectionChange, UpdateFilterTables and
      # UpdateAllListAuto -- over worksheets LLDataEntry built, which is what
      # TestEventLinelist above cannot do: it seeds its sheets by hand, and a
      # hand-seeded sheet agrees with whatever the test that wrote it believed.
      # That is how the go-to branch stayed dead on every sheet the builder
      # makes while the suite reported green. The fixture is the one
      # TestLLDataEntry uses -- a designer-shaped workbook and a workbook
      # standing in for the linelist, both built once per module -- with a
      # dictionary copy added so the editable label branch can write back, and
      # the list auto origin marked the way LinelistSpecs marks it. The
      # workbook carries NO LinelistTranslation worksheet on purpose: the
      # header branch answers a refused edit with a message box whenever a
      # translator is there, and a box stops a headless run on a modal. It
      # reaches PrepareDictionaryFixture, PrepareChoicesFixture,
      # PrepareLLFormatFixture, PrepareFormulaFixtureSheet and
      # PreparePasswordsFixture under `helpers`, and its helper calls are
      # unqualified so they resolve to TestHelpersLite.
      - module: TestEventLinelistSheets
        covers: [EventLinelist]
      # TestLLLog drives the log store over a bare workbook per test: the
      # sheet provisioning, the append across two flushes, the outcome
      # colours, the rotation past the row cap and the separator guard on
      # the detail. The rotation is reached by seeding one cell past the
      # cap, so the suite never writes ten thousand rows. It reaches no
      # fixture module; its helper calls are unqualified, so they resolve
      # to TestHelpersLite.
      - module: TestLLLog
        covers: [LLLog]

  # --- dev (Development) ----------------------------------------------------
  # THIS BLOCK CARRIES A TEST MODULE AND NO CLASS, AND IT MUST STAY THAT WAY.
  # Development is one of the components imported BY HAND into the driver
  # workbook (see automated-testing-macos.md 4.1) -- it is what builds the
  # Codes-sheet tables the runner reads, so it has to exist before ImportAll
  # can run. Adding `- name: Development` here makes ImportAll keep BOTH
  # copies, the second one named Development1, and the project stops compiling:
  # the runner shows the opaque -50 with the import log reporting "done".
  #
  # So TestDevelopment exercises the copy inside unit_tests_dev.xlsb, NOT
  # src/classes/dev/Development.cls. An edit to that file reaches these tests
  # only after a hand re-import in the VBE. The copy was refreshed on
  # 2026-07-29, which is what let this block be added.
  #
  # TestDevelopment needs PasswordsTestFixture (registered under `helpers`) and
  # JoinPath / EnsureFolder / ParentFolder, which were copied into
  # TestHelpersLite for it.
  #
  # TestDevelopment was parked for a long time: its tests write real files, add
  # and remove VBComponents and deploy a workbook, so they are the slowest kind
  # here. It is back in the loop and green.
  #
  # WHAT IT ACTUALLY MEASURES IS STILL THE BAKED COPY. These tests report on
  # the Development inside unit_tests_dev.xlsb, never on
  # src/classes/dev/Development.cls, so an edit to that file reaches them only
  # after a hand re-import in the VBE. A green run here is therefore evidence
  # about the workbook's copy and not about the source -- which is worth
  # remembering before reading it as coverage of a change you just made.
  - folder: dev
    modules:
      # RibbonDev is here for EventSetup, which calls RibbonDev.ActualRibbon to
      # reach the ribbon object the host owns. That call is the one sanctioned
      # class-to-module call in the project, so the module travels with the
      # class. It names Development, CustomTable, OSFiles and Passwords:
      # CustomTable and OSFiles are under `general`, Development and Passwords
      # are baked into the driver workbook. Its fifteen public names clash with
      # nothing already there.
      - RibbonDev
    tests:
      - module: TestDevelopment
        covers: [Development]

  # --- sections -------------------------------------------------------------
  # SectionBuilder and VarWriter are the terminals of linelist generation:
  # SectionBuilder groups the dictionary rows of one sheet into sections and
  # subsections, VarWriter puts each variable on the worksheet. These two rows
  # are the first time either class has been compiled by the harness.
  #
  # The interface: true flag this block used to carry is gone with the files it
  # named: ISectionBuilder and IVarWriter were folded away by 8beb1296, and both
  # enums (SectionBuilderMode, VarWriterLayer) live in the classes now.
  #
  # The closure adds nothing. Everything the two classes name is registered
  # already (LinelistSpecs, LLdictionary, LLVariables, LLSheets, LLFormat,
  # FormulaData, Formulas, DropdownLists, LLGeo) or baked into the driver
  # workbook (BetterArray, Checking, HiddenNames, TranslationObject).
  #
  # Both suites build a real LinelistSpecs through EnsureSpecsSheets and a real
  # TranslationObject through BuildTranslationObject. Both routines were copied
  # into TestHelpersLite for them, because the run imports Lite alone. They also
  # call PrepareDictionaryFixture, PrepareLLFormatFixture and
  # PrepareFormulaFixtureSheet, all three registered under `helpers`.
  - folder: sections
    classes:
      - name: VarWriter
      - name: SectionBuilder
      # SectionMap records where each section of a sheet begins and ends.
      # SectionBuilder writes it as it builds, and the ribbon's section toggle
      # reads it. It names HiddenNames, BetterArray and Checking, all three of
      # which are baked into the driver workbook, so this row closes its own
      # compile.
      - name: SectionMap
    tests:
      - module: TestVarWriter
        covers: [VarWriter]
      - module: TestSectionBuilder
        covers: [SectionBuilder]
      - module: TestSectionMap
        covers: [SectionMap]

  # --- showhide (ShowHide, ShowHideLayout, ShowHideStore) --------------------
  # The show/hide feature is three classes: ShowHide says which variables a
  # sheet offers and which of them are hidden, ShowHideLayout writes that to a
  # worksheet, ShowHideStore keeps the choices between two sessions. They
  # replace LLShowHide and ShowHideManager, which were two halves of the same
  # feature and neither of them whole.
  #
  # These three rows are the first time any of this code has been compiled by
  # the harness. src/tests/showhide/ held 506 lines that had never run, because
  # the folder was absent from this file, so the runner never copied it into the
  # run dir.
  #
  # The closure adds nothing. LLdictionary and LLVariables are registered under
  # dictionary; Passwords, BetterArray and Checking are baked into the driver
  # workbook, so none of the three may take a class row here. The suite calls
  # PrepareDictionaryFixture, registered under helpers.
  #
  # LLExporter and LLImporter type all three, so the dataio folder unblocks on
  # these rows.
  # SectionShowHide joined on 2026-08-14. It binds the three above to
  # SectionMap so the section button and the sections form act on a section the
  # same way. SectionMap is registered under `sections`, which comes before this
  # block, so the closure is whole. The suite calls PrepareDictionaryFixture,
  # registered under helpers.
  - folder: showhide
    classes:
      - name: ShowHide
      - name: ShowHideLayout
      - name: ShowHideStore
      - name: SectionShowHide
    tests:
      - module: TestShowHide
        covers: [ShowHide, ShowHideLayout, ShowHideStore]
      - module: TestSectionShowHide
        covers: [SectionShowHide]

  # --- dataio ---------------------------------------------------------------
  # Registered on 2026-08-02. Every class of the folder had never been compiled
  # by the harness before that day, and all five import clean:
  #   ChoiceKeys 97 | ImportMetadata 367 | ImportReport 481
  #   LLExporter 1691 | LLImporter 1598
  #
  # The closure is closed. LLdictionary, LLVariables and LLExport are registered
  # under dictionary; DataSheet, CustomTable and LLChoices under general; LLGeo
  # under geo; AnaTabIds under analyses; LLTranslation under linelist; ShowHide,
  # ShowHideLayout and ShowHideStore under showhide. Passwords, HiddenNames,
  # TranslationObject, Checking and BetterArray are baked into the driver
  # workbook and must not be registered.
  #
  # WHAT USED TO HOLD IT BACK, and no longer does: TestLLExporter.ModuleCleanup
  # raised 1004 out of CustomTest.PrintResults, and a raise in a lifecycle hook
  # is a modal that costs the whole run. Session 52 changed ModuleCleanup to
  # drop its fixture workbook before printing, on the reading that the writes
  # were aimed at a sheet of a book that was not active. That change is proved
  # now: the suite runs.
  #
  # ExportButton joined on 2026-08-12, and the two reasons it used to stay out
  # are both gone. It declares `WithEvents Btn As MSForms.CommandButton`, so it
  # puts the Forms 2.0 library on the compile path of every run; the driver
  # workbook already references that library, because it carries a UserForm.
  # And TestExportButton's translation stub reads BuildTranslationObject, which
  # was copied into TestHelpersLite for the sections and linelist suites.
  #
  - folder: dataio
    classes:
      - name: ChoiceKeys
      - name: ExportButton
      - name: FilteredData
      - name: ImportMetadata
      - name: ImportReport
      - name: LLExporter
      - name: LLImporter
    tests:
      - module: TestChoiceKeys
        covers: [ChoiceKeys]
      # TestExportButton drives the wrapper behind every custom export button
      # on F_Export: the factory guards, the export number read off the button
      # name, and the filter checkbox. RunExport opens a folder picker and ends
      # in a message box, so the click path stays a hand check. It reaches no
      # fixture module; its helper calls are unqualified, so they resolve to
      # TestHelpersLite.
      - module: TestExportButton
        covers: [ExportButton]
      # TestExportOtherLinelist walks the other-linelist export of F_ExportMig
      # one step at a time against a real linelist, src/tests/.input/
      # old_linelist.xlsb, which the path used to fail on. The walk is
      # CreateFromFile, then the two reads an export depends on, then
      # ExportMigration and the two ExportGeo calls, and each step is its own
      # test so the report names the step that refused rather than the walk.
      # It also reads what that file carries -- the geo tables and names, the
      # password sheet, the translation sheet -- so an old layout is recorded
      # rather than guessed at.
      # The file is gitignored and travels through the push and pull asset
      # scripts, so a machine that has not pulled it reads every step as a
      # skip and no step as a failure. It reaches no fixture module; its helper
      # calls are unqualified, so they resolve to TestHelpersLite.
      - module: TestExportOtherLinelist
        covers: [LLExporter]
      # TestFilteredData drives the filtered-companion sync two callers run:
      # ExportButton ahead of a filtered export, and
      # EventLinelist.UpdateFilterTables on every filter refresh. It covers the
      # copy, the hidden rows and empty rows the companion leaves out, the
      # skip-and-record failure surface and the failure line of the user log.
      # The fixture is a fresh workbook per test. It reaches no fixture module;
      # its helper calls are unqualified, so they resolve to TestHelpersLite.
      - module: TestFilteredData
        covers: [FilteredData]
      - module: TestImportMetadata
        covers: [ImportMetadata]
      - module: TestImportReport
        covers: [ImportReport]
      - module: TestLLExporter
        covers: [LLExporter]
      # TestLLImporter reaches DictionaryTestFixture, PasswordsTestFixture and,
      # since the geobase pair joined on 2026-08-12, GeoTestFixture -- all three
      # under helpers. That pair drives ImportGeobase over a geobase workbook of
      # its own and pins the contract every caller of an import owes: a manager
      # read before the import keeps the level label it cached, so the import
      # has to be followed by a cache drop.
      - module: TestLLImporter
        covers: [LLImporter]

  # --- msetup (the master setup and its Disease subsystem) -------------------
  # The whole master setup joined on 2026-08-25 (15 suites): the nine IDisease* interfaces
  # folded into their classes, the three missing classes were written, and the
  # ribbon translation dropdown went away, which ended the clash its LangLabel
  # and clickLangChange had with the two names EventsDesignerCore declares.
  # MasterSetupEventsManager carries an Ms prefix on MsWorkbookOpened and
  # MsSheetChanged for the same reason: EventsManager under `setup` declares
  # the bare names.
  #
  # The classes name ProjectError, ApplicationState, CustomTable, DataSheet,
  # DropdownLists, LLChoices and OSFiles, all registered under `general`, and
  # BetterArray, Checking, HiddenNames, Passwords and TranslationObject, all
  # baked into the driver workbook. The modules add SetupTranslationsTable and
  # UpdatedValues (under `setup`) and LLdictionary with LLVariables (under
  # `dictionary`). So the rows below open nothing further.
  #
  # MasterSetupImportService lands a disease table on a disease worksheet
  # and folds a setup export back into the Variables and Choices sheets;
  # MasterSetupExports walks the files and builds it over the master managers.
  - folder: msetup
    classes:
      - name: DiseaseExportWorkbook
      - name: DiseaseLogger
      - name: DiseaseImportSummary
      - name: DiseaseImporter
      - name: DiseaseExporter
      - name: DiseaseWorksheetManager
      - name: DiseaseReportManager
      - name: DiseaseSheet
      - name: MasterSetupVariables
      - name: MasterSetupPreparation
      - name: MasterSetupImportService
      # MasterSetupMigration owns the migration file at both ends: the export
      # of the whole master setup and its import into a fresh file.
      - name: MasterSetupMigration
      # DiseaseComparison reads two disease tables and answers the
      # differences as Checking bundles; it holds no worksheet of its own.
      - name: DiseaseComparison
      # DiseaseComparisonReport renders those bundles on __compRep through
      # CheckingOutput, clearing the sheet so one report stands at a time.
      # CheckingOutput and Checking are baked into the driver workbook, so it
      # opens nothing further either.
      - name: DiseaseComparisonReport
      # MasterSetupLog keeps the dated user log on the very hidden __log
      # worksheet, the master setup copy of LLLog; Checking, CheckingOutput
      # and HiddenNames are baked into the driver workbook.
      - name: MasterSetupLog
      - name: EventMasterSetup
    modules:
      - MasterSetupHelpers
      - MasterSetupEventsManager
      - MasterSetupExports
      # EventMasterSetupWorkbook is the ThisWorkbook code of the master setup
      # workbook; as a standard module its handlers are plain private subs.
      - EventMasterSetupWorkbook
      # CustomMasterSetupFunctions carries the two worksheet functions the
      # disease table formulas call: MainLabelValue and ChoiceValues.
      - CustomMasterSetupFunctions
      # The ribbon callbacks compile against IRibbonControl from the Office
      # library, the same way the setup and designer event modules do.
      # clickDevInitialize also names RibbonDev.EnsureDevelopment and the
      # Development type: RibbonDev is registered under `dev` and
      # Development is baked into the driver workbook.
      - EventsMasterSetupRibbon
    tests:
      - module: TestDiseaseExportWorkbook
        covers: [DiseaseExportWorkbook]
      - module: TestDiseaseLogger
        covers: [DiseaseLogger]
      - module: TestDiseaseImporter
        covers: [DiseaseImporter, DiseaseImportSummary]
      - module: TestDiseaseExporter
        covers: [DiseaseExporter]
      - module: TestDiseaseWorksheetManager
        covers: [DiseaseWorksheetManager]
      - module: TestDiseaseReportManager
        covers: [DiseaseReportManager]
      - module: TestDiseaseSheet
        covers: [DiseaseSheet]
      - module: TestDiseaseIntegration
        covers: [DiseaseSheet, DiseaseExporter, DiseaseImporter, DiseaseWorksheetManager]
      - module: TestMasterSetupVariables
        covers: [MasterSetupVariables]
      - module: TestMasterSetupPreparation
        covers: [MasterSetupPreparation]
      # TestMasterSetupImportService exports a disease through DiseaseExporter
      # and folds the file back: the sheet rebuilt or merged, the Variables
      # table and the Choices sheet taking what they lacked.
      - module: TestMasterSetupImportService
        covers: [MasterSetupImportService, MasterSetupVariables, DiseaseSheet]
      # TestMasterSetupMigration exports the whole fixture master setup into
      # a migration workbook, wipes the fixture and reads the file back; it
      # also pins the refusal of a target that already carries data.
      - module: TestMasterSetupMigration
        covers: [MasterSetupMigration, MasterSetupImportService, DiseaseSheet]
      # TestDiseaseComparison drives the four sections and the statistics
      # over a fixture pair of disease tables.
      - module: TestDiseaseComparison
        covers: [DiseaseComparison]
      # TestDiseaseComparisonReport writes a fixture comparison on __compRep
      # and runs it twice, so the sheet is read for one report alone.
      - module: TestDiseaseComparisonReport
        covers: [DiseaseComparisonReport, DiseaseComparison]
      - module: TestEventMasterSetup
        covers: [EventMasterSetup]
      # TestMasterSetupLog drives the log store over a bare workbook per
      # test: the provisioning, the three sections, the rotation and the
      # text report with its disease worksheet count.
      - module: TestMasterSetupLog
        covers: [MasterSetupLog]
      - module: TestMasterSetupHelpers
        covers: [MasterSetupHelpers]
      # TestMasterSetupEvents drives the whole event chain: the workbook
      # handlers' targets in MasterSetupEventsManager, the preparation's
      # dropdown placement, the disease line fill and the choices label
      # recalculation.
      - module: TestMasterSetupEvents
        covers: [MasterSetupEventsManager, MasterSetupPreparation, EventMasterSetup]
      # TestDiseaseSetupImport proves the disease export imports cleanly into
      # a setup: it drives SetupImport (under `setup`) over a file
      # DiseaseExporter wrote, arranging with SetupImportTestFixture,
      # DictionaryTestFixture and PasswordsTestFixture under `helpers`.
      - module: TestDiseaseSetupImport
        covers: [DiseaseExporter]


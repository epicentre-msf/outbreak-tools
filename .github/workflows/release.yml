name: Release on changelog

# Version numbers are cut on main and nowhere else. A dev build never gets a version
# of its own — it lives in the single moving 'dev-latest' pre-release, refreshed by
# dev-latest.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["CHANGELOG.md"]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse changelog (top semantic version + its notes)
        id: cl
        run: |
          ver=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
                | sed -E 's/^## \[(.*)\]/\1/' || true)
          if [ -z "$ver" ]; then
            echo "::error::No '## [MAJOR.MINOR.PATCH]' heading found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # index()==1 so a heading may carry a trailing date: '## [2.0.0] - 2026-08-14'.
          awk -v h="## [$ver]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          echo "Resolved version: $ver"

      - name: Does this version's release already exist?
        id: ex
        run: |
          if gh release view "v${{ steps.cl.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.cl.outputs.version }} already exists — leaving it immutable."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + publish the versioned release (immutable, pinned to this commit)
        if: steps.ex.outputs.exists == 'false'
        run: |
          VER="${{ steps.cl.outputs.version }}"
          TAG="v$VER"
          bash scripts/release/pull-assets.sh
          bash scripts/release/build-release-zip.sh main "$VER"
          # Drop any stale tag that has no release, so --target binds to THIS commit.
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
          fi
          gh release create "$TAG" "OBT-main-${VER}.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --latest

      - name: Refresh the stable download alias (idempotent self-heal)
        run: |
          VER="${{ steps.cl.outputs.version }}"
          TAG="v$VER"
          tmp="$(mktemp -d)"
          # Source the canonical asset from the (now-existing) versioned release.
          gh release download "$TAG" -p "OBT-main-${VER}.zip" -D "$tmp" --clobber
          cp "$tmp/OBT-main-${VER}.zip" OBT-main-latest.zip
          gh release upload "$TAG" OBT-main-latest.zip --clobber

      - name: Refresh the releases page after the release exists
        if: steps.ex.outputs.exists == 'false'
        run: gh workflow run publish.yml --ref dev
